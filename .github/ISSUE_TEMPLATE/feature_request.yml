name: Feature request
description: Ask for a new endpoint, model field or helper
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would you like to call it?
      render: python
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Endpoint documentation, payload examples, related issues.
