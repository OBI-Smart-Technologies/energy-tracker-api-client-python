name: Release

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse to release from anything but main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main only, not from ${{ github.ref }}."
            exit 1
          fi
      - name: Refuse to release without a license
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::No LICENSE file. An unlicensed package on PyPI may not legally be used by anyone — add the license before releasing."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"
      - name: Refuse to release an already tagged version
        if: inputs.index == 'pypi'
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Bump the version in pyproject.toml first."
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to ${{ inputs.index }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/project/obi-energy-tracker/' || 'https://test.pypi.org/project/obi-energy-tracker/' }}${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: Tag and create GitHub release
    needs: [build, publish]
    if: inputs.index == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
