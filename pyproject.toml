[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obi-energy-tracker"
version = "0.1.0"
description = "Async client for the OBI ENERGY TRACKER cloud API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "OBI Smart Technologies GmbH" }]
keywords = ["obi", "energy-tracker", "energy", "smart-home", "asyncio", "aiohttp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/OBI-Smart-Technologies/energy-tracker-api-client-python"
Repository = "https://github.com/OBI-Smart-Technologies/energy-tracker-api-client-python"
Issues = "https://github.com/OBI-Smart-Technologies/energy-tracker-api-client-python/issues"
Changelog = "https://github.com/OBI-Smart-Technologies/energy-tracker-api-client-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["obi_energy_tracker"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
local_partial_types = true
strict_bytes = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
